// Add your dependencies here
//
// Everything is compileOnly: the jar declares no hard mod dependencies and every integration is gated at runtime
// (Loader.isModLoaded via Compat, late mixins via LateMixinLoader). Pins decide what the code is WRITTEN against,
// not what it binds to — the pack always ships these mods, a dev environment may not.
//
// transitive=false where a mod's transitive deps are purged from the GTNH maven (GT5U pulls CodeChickenLib 1.3.0,
// see gtnh-determinism). NEI keeps transitives: the NEISPH mixin signature needs codechicken.lib.packet.PacketCustom.

dependencies {
    compileOnly('com.github.GTNewHorizons:NotEnoughItems:2.8.145-GTNH:dev')
    // AE2 is the one exception to compileOnly: devOnlyNonPublishable puts it on the dev RUNTIME classpath too,
    // so `runServer` actually constructs Ae2Snapshotter (gated on Compat.AE2.isLoaded) and Ae2Bench has real
    // AEItemStacks to census. Still absent from the published jar's dependency list — same as every other mod
    // here. AE2 is a coremod (FMLCorePlugin: appeng.transformer.AppEngCore) with required-after:gtnhlib, hence
    // the GTNHLib line below also being dev-runtime.
    devOnlyNonPublishable('com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-1073-GTNH:dev') { transitive = false }
    compileOnly('com.github.GTNewHorizons:BetterQuesting:3.8.87-GTNH:dev') { transitive = false }
    compileOnly('com.github.GTNewHorizons:Baubles-Expanded:2.2.24-GTNH:dev') { transitive = false }
    compileOnly('com.github.GTNewHorizons:GT5-Unofficial:5.09.54.183:dev') { transitive = false }
    // GT's interfaces leak these two into any call on a MetaTileEntity (IGregTechTileEntity extends GTNHLib's
    // CapabilityProvider, MetaTileEntity implements ModularUI's IGuiHolder) — needed to compile the GT mixins.
    devOnlyNonPublishable('com.github.GTNewHorizons:GTNHLib:0.11.51:dev') { transitive = false }
    compileOnly('com.github.GTNewHorizons:ModularUI2:2.3.91-1.7.10:dev') { transitive = false }
    compileOnly('com.github.GTNewHorizons:Railcraft:9.17.31:dev') { transitive = false }
    // /nbtedit payload hook (MessageEditNBTResponseMixin) — class shape verified identical at 2.2.2 (pack
    // 2.8.4) and 2.4.3 (dailies).
    compileOnly('com.github.GTNewHorizons:ServerUtilities:2.4.13:dev') { transitive = false }

    testImplementation('org.junit.jupiter:junit-jupiter:5.10.2')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.10.2')
}

// Add your dependencies here
//
// Everything is compileOnly: the jar declares no hard mod dependencies and every integration is gated at runtime
// (Loader.isModLoaded via Compat, late mixins via LateMixinLoader). Pins decide what the code is WRITTEN against,
// not what it binds to — the pack always ships these mods, a dev environment may not.
//
// transitive=false where a mod's transitive deps are purged from the GTNH maven (GT5U pulls CodeChickenLib 1.3.0,
// see gtnh-determinism). NEI keeps transitives: the NEISPH mixin signature needs codechicken.lib.packet.PacketCustom.

dependencies {
    compileOnly('com.github.GTNewHorizons:NotEnoughItems:2.8.114-GTNH:dev')
    compileOnly('com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-1017-GTNH:dev') { transitive = false }
    compileOnly('com.github.GTNewHorizons:BetterQuesting:3.8.74-GTNH:dev') { transitive = false }
    compileOnly('com.github.GTNewHorizons:Baubles-Expanded:2.2.22-GTNH:dev') { transitive = false }
    compileOnly('com.github.GTNewHorizons:GT5-Unofficial:5.09.54.115:dev') { transitive = false }
    // GT's interfaces leak these two into any call on a MetaTileEntity (IGregTechTileEntity extends GTNHLib's
    // CapabilityProvider, MetaTileEntity implements ModularUI's IGuiHolder) — needed to compile the GT mixins.
    compileOnly('com.github.GTNewHorizons:GTNHLib:0.11.16:dev') { transitive = false }
    compileOnly('com.github.GTNewHorizons:ModularUI2:2.3.79-1.7.10:dev') { transitive = false }
    compileOnly('com.github.GTNewHorizons:Railcraft:9.17.29:dev') { transitive = false }

    testImplementation('org.junit.jupiter:junit-jupiter:5.10.2')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

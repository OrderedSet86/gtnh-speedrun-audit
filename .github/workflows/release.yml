name: Release jar

# Manual trigger only: Actions tab -> "Release jar" -> Run workflow, enter the version
# (e.g. 0.3.0). Tags the version, builds, and attaches the obfuscated jar to a GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.0)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Tag before building so GTNHGradle's git-describe version stamps the jar with it
      - name: Tag
        run: |
          git config user.name "OrderedSet86"
          git config user.email "orderedset86@users.noreply.github.com"
          git tag "v${{ inputs.version }}"

      - name: Build
        run: ./gradlew build -x spotlessCheck

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp $(ls build/libs/*.jar | grep -v -- -dev | grep -v -- -sources | head -1) \
             "dist/gtnhspeedrunaudit-${{ inputs.version }}.jar"
          ls -la dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "v${{ inputs.version }}"
          gh release create "v${{ inputs.version }}" dist/*.jar \
            --title "gtnhspeedrunaudit ${{ inputs.version }}" \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            --notes "Tamper-evident audit trail for GTNH speedruns. One jar: install in the server's mods/ for multiplayer (clients need nothing) or in your own mods/ for singleplayer — same jar covers pack 2.8.4 and dailies. Submit runs with /audit export; verifiers start at SUMMARY.txt and VERIFIERS.md."